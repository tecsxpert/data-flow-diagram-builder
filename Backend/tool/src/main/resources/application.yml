spring:
  cache:
    type: redis
    redis:
      time-to-live: 10m
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/dfd_builder}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:your_db_password_here}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    validate-on-migrate: false
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password_here}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:your_base64_jwt_secret_key_at_least_32_chars_long}
  expiration: ${JWT_EXPIRATION:86400000}
